name: Build PhytoNote APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Create Capacitor project
      run: |
        echo '{
          "name": "PhytoNote",
          "version": "1.0.0",
          "dependencies": {
            "@capacitor/share": "^6.0.0",
            "@capacitor/filesystem": "^6.0.0"
          },
          "devDependencies": {
            "@capacitor/cli": "^6.0.0",
            "@capacitor/android": "^6.0.0"
          }
        }' > package.json

    - name: Install dependencies
      run: npm install

    - name: Copy web assets
      run: |
        mkdir -p www
        cp -r assets/* www/

    - name: Initialize Capacitor and add Android
      run: |
        npx cap init "PhytoNote" "com.phytonote.app" --web-dir www
        npx cap add android
        npx cap update
        npx cap sync

    - name: Copy icons
      run: |
        ICON_PATH="assets/phytonote/icons"
        
        echo "📂 Looking for icons in: $ICON_PATH"
        ls -la $ICON_PATH || echo "⚠️ Icon folder not found"
        
        for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
          mkdir -p android/app/src/main/res/mipmap-$density
        done

        [ -f "$ICON_PATH/icon-48.png" ] && cp "$ICON_PATH/icon-48.png" android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        [ -f "$ICON_PATH/icon-72.png" ] && cp "$ICON_PATH/icon-72.png" android/app/src/main/res/mipmap-hdpi/ic_launcher.png
        [ -f "$ICON_PATH/icon-96.png" ] && cp "$ICON_PATH/icon-96.png" android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
        [ -f "$ICON_PATH/icon-144.png" ] && cp "$ICON_PATH/icon-144.png" android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
        [ -f "$ICON_PATH/icon-192.png" ] && cp "$ICON_PATH/icon-192.png" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

        echo "✅ Icons copied"

    - name: Add storage permissions
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        
        sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>' "$MANIFEST"
        sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/' "$MANIFEST"
        
        echo "✅ Permissions added"

    - name: Create keystore
      run: |
        keytool -genkey -v \
          -keystore phytonote.keystore \
          -alias phytonote \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass phytonote123 \
          -keypass phytonote123 \
          -dname "CN=PhytoNote, OU=App, O=PhytoNote, L=City, S=State, C=US"
        
        # Копируем keystore в папку android (чтобы путь был проще)
        cp phytonote.keystore android/
        
        echo "✅ Keystore created and copied to android/"

    - name: Configure signing
      run: |
        cd android
        echo 'android {
            signingConfigs {
                release {
                    storeFile file("phytonote.keystore")
                    storePassword "phytonote123"
                    keyAlias "phytonote"
                    keyPassword "phytonote123"
                }
            }
            buildTypes {
                release {
                    signingConfig signingConfigs.release
                }
            }
        }' >> app/build.gradle
        
        echo "✅ Signing configured"

    - name: Build APK
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: phytonote-apk
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 7

    - name: Upload keystore backup
      uses: actions/upload-artifact@v4
      with:
        name: phytonote-keystore-backup
        path: phytonote.keystore
        retention-days: 7
